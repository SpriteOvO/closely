[package]
name = "closely"
version = "0.1.23"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
const_format = "0.2.35"
futures = "0.3.31"
headless_chrome = "1.0.18"
http = "1.3.1"
http-serde = "2.1.1"
humansize = "2.1.3"
humantime-serde = "1.1.1"
image = "0.25.8"
itertools = "0.14.0"
paste = "1.0.15"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["json", "gzip", "multipart"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
shadow-rs = "1.4.0"
spdlog-rs = { version = "0.5.2", features = ["source-location"] }
spdlog-opentelemetry = { version = "0.1.0" }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
    "sync",
    "process",
] }
toml = "0.9.8"
warp = { version = "0.4.2", features = ["server"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "logs"] }
opentelemetry_sdk = "0.31.0"

[build-dependencies]
shadow-rs = "1.4.0"

[dev-dependencies]
parking_lot = "0.12.5"
