[package]
name = "closely"
version = "0.1.24"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
const_format = "0.2.35"
futures = "0.3.31"
headless_chrome = "1.0.20"
humansize = "2.1.3"
humantime-serde = "1.1.1"
image = "0.25.9"
itertools = "0.14.0"
paste = "1.0.15"
rand = "0.9.2"
reqwest = { version = "0.12.28", features = ["json", "gzip", "multipart"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
shadow-rs = "1.5.0"
spdlog-rs = { version = "0.5.2", features = ["source-location"] }
spdlog-opentelemetry = { version = "0.1.0" }
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
    "sync",
    "process",
] }
toml = "0.9.11"
warp = { version = "0.4.2", features = ["server"] }
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "logs"] }
opentelemetry_sdk = "0.31.0"
regex = "1.12.2"
html2text = "0.16.5"
feed-rs = "2.3.1"
octocrab = "0.49.5"

[build-dependencies]
shadow-rs = "1.5.0"

[dev-dependencies]
parking_lot = "0.12.5"
